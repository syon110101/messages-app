<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Messages App</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f4f7;color:#222}header{background:#4f7cff;color:#fff;padding:18px;text-align:center;font-size:24px;font-weight:bold}.container{max-width:700px;margin:30px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:25px;box-shadow:0 5px 20px #00000014}h2{text-align:center;margin-top:0}input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;background:#4f7cff;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}#chatScreen{display:none}.roomInfo{background:#eef2ff;padding:12px;border-radius:10px;margin-bottom:15px;text-align:center;font-weight:bold}.status{text-align:center;font-size:13px;margin:8px;color:#555}.messages{height:400px;overflow-y:auto;border:1px solid #ddd;border-radius:12px;padding:15px;background:#fafafa}.message{margin:10px 0;display:flex;flex-direction:column}.message.mine{align-items:flex-end}.message.other{align-items:flex-start}.name{font-size:12px;color:#777;margin-bottom:4px}.bubble{max-width:75%;padding:10px 14px;border-radius:16px;background:#e5e7eb;word-break:break-word}.mine .bubble{background:#4f7cff;color:#fff}.meta{font-size:11px;color:#888;margin-top:3px}.sendArea{display:flex;gap:8px;margin-top:12px}.sendArea input{margin:0;flex:1}.sendArea button{width:90px;margin:0}.leave{background:#777;margin-top:12px}.empty{text-align:center;color:#999;margin-top:150px}.error{color:#e53935;text-align:center;margin-top:10px;font-size:14px}.adminBox{display:none;background:#fff8df;border:1px solid #f0d56a;border-radius:12px;padding:12px;margin-bottom:15px}.adminTitle{font-weight:bold;margin-bottom:8px}.userRow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eee}.userRow button{width:auto;padding:6px 10px;margin:0;background:#e53935;font-size:12px}.adminBadge{color:#d28b00;font-weight:bold}
</style></head><body><header>💬 Messages App</header><div class="container">
<div class="card" id="loginScreen"><h2>채팅방 입장</h2><input id="nickname" placeholder="닉네임 입력" maxlength="15"><input id="roomNumber" placeholder="5자리 방 번호" maxlength="5" inputmode="numeric"><input id="adminPassword" type="password" placeholder="관리자라면 비밀번호 입력 (선택)"><button onclick="joinRoom()">채팅방 들어가기</button><div class="error" id="error"></div></div>
<div class="card" id="chatScreen"><h2>💬 채팅</h2><div class="roomInfo">방 번호: <span id="roomDisplay"></span><br>👤 <span id="nicknameDisplay"></span></div><div class="status" id="status">연결 중...</div>
<div class="adminBox" id="adminBox"><div class="adminTitle">👑 관리자 · 접속자 목록</div><div id="userList"></div></div>
<div class="messages" id="messages"><div class="empty">아직 메시지가 없습니다.</div></div><div class="sendArea"><input id="messageInput" placeholder="메시지를 입력하세요" maxlength="300" onkeydown="handleEnter(event)"><button onclick="sendMessage()">전송</button></div><button class="leave" onclick="leaveRoom()">채팅방 나가기</button></div></div>
<script>
const SERVER="wss://messages-server.pso20060101.workers.dev/ws";let nickname="",roomNumber="",socket=null,senderId=crypto.randomUUID(),isAdmin=false;
function joinRoom(){const n=document.getElementById('nickname').value.trim(),r=document.getElementById('roomNumber').value.trim(),p=document.getElementById('adminPassword').value,e=document.getElementById('error');e.textContent='';if(!n){e.textContent='닉네임을 입력해주세요.';return}if(!/^\d{5}$/.test(r)){e.textContent='방 번호는 5자리 숫자로 입력해주세요.';return}if(n==='관리자'&&!p){e.textContent='관리자 닉네임은 비밀번호가 필요합니다.';return}nickname=n;roomNumber=r;document.getElementById('nicknameDisplay').textContent=n;document.getElementById('roomDisplay').textContent=r;document.getElementById('loginScreen').style.display='none';document.getElementById('chatScreen').style.display='block';document.getElementById('messages').innerHTML='<div class="empty">연결 중...</div>';connect();document.getElementById('messageInput').focus()}
function connect(){let u=SERVER+'?room='+encodeURIComponent(roomNumber)+'&name='+encodeURIComponent(nickname)+'&id='+encodeURIComponent(senderId);if(nickname==='관리자'){u+='&admin=1&password='+encodeURIComponent(document.getElementById('adminPassword').value)}socket=new WebSocket(u);socket.onopen=()=>document.getElementById('status').textContent='🟢 연결됨';socket.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='history'){isAdmin=!!d.isAdmin;document.getElementById('adminBox').style.display=isAdmin?'block':'none';document.getElementById('messages').innerHTML='';if(!d.messages.length)showEmpty();d.messages.forEach(addMessage);scrollBottom()}else if(d.type==='message'){addMessage(d);scrollBottom();if(d.senderId!==senderId)sendRead(d.messageId)}else if(d.type==='read'){markRead(d.messageId)}else if(d.type==='users'){if(isAdmin)renderUsers(d.users)}else if(d.type==='system')showSystem(d.text);else if(d.type==='kicked'){alert('관리자에 의해 채팅방에서 강퇴되었습니다.');leaveRoom()}};socket.onclose=ev=>{if(ev.code===4001)return;document.getElementById('status').textContent='🔴 연결 끊김'};socket.onerror=()=>document.getElementById('status').textContent='🔴 서버 연결 오류'}
function sendMessage(){const i=document.getElementById('messageInput'),t=i.value.trim();if(!t)return;if(!socket||socket.readyState!==WebSocket.OPEN){alert('서버에 연결되어 있지 않습니다.');return}socket.send(JSON.stringify({type:'message',text:t}));i.value='';i.focus()}
function addMessage(m){const box=document.getElementById('messages');const empty=box.querySelector('.empty');if(empty)empty.remove();const d=document.createElement('div');d.className='message '+(m.senderId===senderId?'mine':'other');d.dataset.messageId=m.messageId||'';const n=document.createElement('div');n.className='name';n.textContent=(m.nickname||'익명')+' · '+(m.time||'');const b=document.createElement('div');b.className='bubble';b.textContent=m.text||'';d.append(n,b);if(m.senderId===senderId){const meta=document.createElement('div');meta.className='meta';meta.textContent='';meta.dataset.read='';d.append(meta)}box.appendChild(d)}
function sendRead(id){if(socket&&socket.readyState===WebSocket.OPEN&&id)socket.send(JSON.stringify({type:'read',messageId:id,senderId:senderId}))}function markRead(id){const el=document.querySelector('.message[data-message-id="'+CSS.escape(id)+'"] .meta');if(el)el.textContent='읽음'}
function renderUsers(users){const box=document.getElementById('userList');box.innerHTML='';users.forEach(u=>{const row=document.createElement('div');row.className='userRow';const name=document.createElement('span');name.innerHTML=(u.isAdmin?'👑 ':'')+escapeHtml(u.nickname)+(u.isAdmin?' <span class="adminBadge">관리자</span>':'');row.appendChild(name);if(!u.isAdmin){const btn=document.createElement('button');btn.textContent='강퇴';btn.onclick=()=>{if(confirm(u.nickname+'님을 강퇴할까요?'))socket.send(JSON.stringify({type:'kick',targetId:u.senderId}))};row.appendChild(btn)}box.appendChild(row)})}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showSystem(t){const box=document.getElementById('messages'),d=document.createElement('div');d.style='text-align:center;color:#999;font-size:12px;margin:8px';d.textContent=t;box.appendChild(d);scrollBottom()}function showEmpty(){document.getElementById('messages').innerHTML='<div class="empty">아직 메시지가 없습니다.</div>'}function scrollBottom(){const b=document.getElementById('messages');b.scrollTop=b.scrollHeight}function handleEnter(e){if(e.key==='Enter')sendMessage()}function leaveRoom(){if(socket){socket.close();socket=null}nickname='';roomNumber='';isAdmin=false;document.getElementById('chatScreen').style.display='none';document.getElementById('loginScreen').style.display='block';document.getElementById('nickname').value='';document.getElementById('roomNumber').value='';document.getElementById('adminPassword').value='';document.getElementById('messageInput').value=''}document.getElementById('roomNumber').addEventListener('input',function(){this.value=this.value.replace(/[^0-9]/g,'')});
</script></body></html>
